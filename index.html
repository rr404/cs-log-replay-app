<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdSec Log Replay</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#00A3FF"/>
          <path d="M20 8L32 14V26L20 32L8 26V14L20 8Z" fill="white" fill-opacity="0.9"/>
          <path d="M20 14L26 17V23L20 26L14 23V17L20 14Z" fill="#00A3FF"/>
        </svg>
        <span>CrowdSec <strong>Log Replay</strong></span>
      </div>
      <div class="header-actions">
        <span id="status-badge" class="badge badge-idle">Idle</span>
      </div>
    </header>

    <!-- Main layout -->
    <div class="main-layout">

      <!-- Left panel: inputs -->
      <aside class="sidebar">

        <!-- Log type -->
        <section class="panel">
          <h3>1. Log Type</h3>
          <select id="log-type-select">
            <option value="">-- none (raw) --</option>
            <option value="syslog">syslog</option>
            <option value="nginx">nginx</option>
            <option value="apache2">apache2</option>
            <option value="ssh">ssh</option>
            <option value="mysql">mysql</option>
          </select>
          <p class="hint">Sets <code>Labels.type</code> on every line</p>
        </section>

        <!-- Parser files -->
        <section class="panel">
          <h3>2. Parser YAML Files</h3>
          <div class="drop-zone" id="parser-drop">
            <input type="file" id="parser-files" multiple accept=".yaml,.yml" />
            <label for="parser-files">
              <span class="drop-icon">📄</span>
              <span>Drop or click to load parser YAMLs</span>
            </label>
          </div>
          <ul id="parser-list" class="file-list"></ul>
          <button class="btn-secondary btn-sm" id="clear-parsers">Clear parsers</button>
        </section>

        <!-- Scenario files -->
        <section class="panel">
          <h3>3. Scenario YAML Files</h3>
          <div class="drop-zone" id="scenario-drop">
            <input type="file" id="scenario-files" multiple accept=".yaml,.yml" />
            <label for="scenario-files">
              <span class="drop-icon">🎯</span>
              <span>Drop or click to load scenario YAMLs</span>
            </label>
          </div>
          <ul id="scenario-list" class="file-list"></ul>
          <button class="btn-secondary btn-sm" id="clear-scenarios">Clear scenarios</button>
        </section>

        <!-- Bucket state -->
        <section class="panel">
          <h3>Options</h3>
          <label class="checkbox-label">
            <input type="checkbox" id="keep-state" />
            Keep bucket state between runs
          </label>
          <button class="btn-secondary btn-sm" id="reset-buckets" style="margin-top:8px">
            Reset bucket state
          </button>
        </section>

        <!-- Run -->
        <section class="panel run-panel">
          <button class="btn-primary" id="run-btn" disabled>
            ▶ Run Replay
          </button>
        </section>

      </aside>

      <!-- Center: log input -->
      <div class="center-panel">
        <div class="panel fill">
          <div class="panel-header">
            <h3>Log Lines</h3>
            <span id="line-count" class="line-count">0 lines</span>
          </div>
          <textarea
            id="log-input"
            placeholder="Paste your log lines here (one per line)&#10;&#10;Example:&#10;May  4 12:01:05 myhost sshd[1234]: Failed password for root from 1.2.3.4 port 22 ssh2&#10;May  4 12:01:08 myhost sshd[1234]: Failed password for root from 1.2.3.4 port 22 ssh2"
            spellcheck="false"
          ></textarea>
        </div>
      </div>

      <!-- Right panel: results -->
      <div class="results-panel">

        <!-- Stats bar -->
        <div id="stats-bar" class="stats-bar hidden">
          <div class="stat"><span id="stat-total">0</span><label>lines</label></div>
          <div class="stat"><span id="stat-parsed">0</span><label>parsed</label></div>
          <div class="stat"><span id="stat-poured">0</span><label>poured</label></div>
          <div class="stat"><span id="stat-alerts">0</span><label>alerts</label></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="alerts">Alerts</button>
          <button class="tab" data-tab="buckets">Bucket Report</button>
        </div>

        <!-- Alerts tab -->
        <div id="tab-alerts" class="tab-content active">
          <div id="alerts-container">
            <div class="empty-state">Run the replay to see alerts</div>
          </div>
        </div>

        <!-- Bucket report tab -->
        <div id="tab-buckets" class="tab-content">
          <div id="buckets-container">
            <div class="empty-state">Run the replay to see bucket state</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
